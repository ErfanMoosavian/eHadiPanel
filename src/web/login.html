<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود — پنل مدیریت مؤسسه امام هادی</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050811;color:#e8edf7;font-family:Vazirmatn,Tahoma,sans-serif}
  form{width:min(360px,92vw);padding:28px;border-radius:16px;background:#0d1426;border:1px solid rgba(255,255,255,.1)}
  h1{font-size:18px;margin:0 0 18px;text-align:center}
  label{display:block;font-size:13px;margin:12px 0 6px;color:#aab6cf}
  input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#080d1b;color:inherit;font:inherit;direction:ltr;text-align:left}
  button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:10px;background:#3b6df0;color:#fff;font:inherit;cursor:pointer}
  button:disabled{opacity:.6}
  #err{min-height:20px;margin-top:12px;font-size:13px;color:#ff8a8a;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>پنل مدیریت مؤسسه امام هادی</h1>
  <label for="u">نام کاربری</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">رمز عبور</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">ورود</button>
  <div id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  fetch('/api/login', {
    method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (d.ok) { window.location.href = '/'; } else { err.textContent = d.error || 'ورود ناموفق بود.'; b.disabled = false; }
  }).catch(function () { err.textContent = 'ارتباط با سرور برقرار نشد.'; b.disabled = false; });
});
</script>
</body>
</html>
